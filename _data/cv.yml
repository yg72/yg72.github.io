cv:
  name: Ada Yiwen Geng
  label: Embedded Systems Engineer
  email: gengyw15@gmail.com
  location: Austin, TX
  summary: "Embedded systems engineer at Infraeo Inc. with an M.S. in Electrical & Computer Engineering from Rice University and a Bachelor & Master of Engineering in Integrated Circuit Engineering from Tsinghua University. Experience spans qualification testing and root-cause debug of 200G to 1.6T copper and optical modules, Python hardware-in-the-loop test automation, GPU observability infrastructure, and RRAM compute-in-memory research. Author of 6 papers, including a first-author DATE 2021 paper, with 3 Chinese patents and 1 U.S. patent."

